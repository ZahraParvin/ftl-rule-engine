[project]
name = "ftl-rule-engine"
version = "0.1.0"
description = "Declarative EASA Subpart FTL crew-legality rule engine"
requires-python = ">=3.10"
dependencies = ["polars>=1.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ftl = "ftl.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
