name: rules
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Regenerate fixtures and verify their arithmetic
        run: python tools/make_fixtures.py
      - name: Fail if fixtures drifted
        run: git diff --exit-code tests/rosters
      - run: pytest -q
